<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827">
<title>FIL — Assistant personnel</title>
<style>
:root{font-family:system-ui,Arial,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#f4f7ff}main{max-width:780px;margin:auto;height:100dvh;display:flex;flex-direction:column}header{padding:17px 20px;border-bottom:1px solid #29364c;display:flex;align-items:center;justify-content:space-between}h1{margin:0;font-size:1.35rem}small{color:#a9bad2}button{cursor:pointer;border:0;border-radius:12px;padding:12px 15px;background:#2876e2;color:white;font:inherit}button:focus-visible,textarea:focus-visible{outline:2px solid #91c4ff}button.secondary{background:#25334a}#chat{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:13px}.msg{padding:13px 15px;max-width:90%;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.45}.user{align-self:flex-end;background:#235ab0}.fil{align-self:flex-start;background:#1c293c}form{display:flex;gap:8px;align-items:end;padding:12px;border-top:1px solid #29364c}textarea{flex:1;resize:none;min-height:48px;max-height:140px;border:1px solid #3d526e;background:#172337;color:white;border-radius:12px;padding:12px;font:inherit}#status{padding:0 15px 10px;color:#b7c8e1;font-size:.8rem}#mic{background:#344967}@media(max-width:450px){form{gap:5px;padding:8px}button{padding:12px 10px}.msg{max-width:95%}}
</style>
</head>
<body><main><header><div><h1>✨ FIL</h1><small>Ton compagnon numérique</small></div><button class="secondary" id="clear" type="button">Effacer</button></header><section id="chat" aria-label="Conversation" aria-live="polite"></section><form id="form"><button id="mic" type="button" aria-label="Parler">🎤</button><textarea id="message" rows="1" placeholder="Écris à FIL…" aria-label="Ton message"></textarea><button type="submit">Envoyer</button></form><div id="status">Mode gratuit local · IA non connectée</div></main>
<script>
'use strict';
const chat=document.getElementById('chat'),field=document.getElementById('message'),status=document.getElementById('status');
const key='fil_messages_v2';let history=[];
try{history=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(history))history=[]}catch{history=[]}
function draw(role,text){const node=document.createElement('div');node.className='msg '+role;node.textContent=text;chat.append(node);chat.scrollTop=chat.scrollHeight}
function add(role,text){history.push({role,text});history=history.slice(-100);try{localStorage.setItem(key,JSON.stringify(history))}catch{}draw(role,text)}
if(history.length){history.forEach(m=>{if((m.role==='fil'||m.role==='user')&&typeof m.text==='string')draw(m.role,m.text)})}else add('fil','Bonjour ! Je suis FIL. Je peux déjà discuter simplement avec toi. Mon moteur d’intelligence artificielle n’est pas encore connecté.');
function answer(text){const t=text.toLocaleLowerCase('fr').trim();if(/^(bonjour|salut|coucou|hello)\b/.test(t))return 'Bonjour ! Comment puis-je t’aider ?';if(/merci/.test(t))return 'Avec plaisir !';if(/(qui es.tu|ton nom|tu t.appelles)/.test(t))return 'Je suis FIL, ton assistant numérique. Pour l’instant, je fonctionne en mode local simplifié.';if(/(quelle heure|l.heure)/.test(t))return 'Il est '+new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})+'.';if(/(date|quel jour)/.test(t))return 'Nous sommes le '+new Date().toLocaleDateString('fr-FR',{dateStyle:'full'})+'.';if(/(aide|que peux.tu faire)/.test(t))return 'Je peux répondre à quelques demandes simples, lire mes réponses à voix haute et conserver cette conversation sur cet appareil. Une véritable IA pourra être ajoutée ensuite.';return 'Je comprends ta question, mais je ne sais pas encore y répondre correctement. Nous devons connecter un moteur d’IA gratuit pour que je puisse répondre à des questions variées.'}
function speak(text){if(!('speechSynthesis' in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='fr-FR';u.rate=1;speechSynthesis.speak(u)}catch{}}
function send(text){text=text.trim();if(!text)return;add('user',text);field.value='';const response=answer(text);add('fil',response);speak(response)}
document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();send(field.value)});
field.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send(field.value)}});
document.getElementById('clear').addEventListener('click',()=>{if(confirm('Effacer toute la conversation sur cet appareil ?')){history=[];chat.replaceChildren();try{localStorage.removeItem(key)}catch{}add('fil','Conversation effacée. Comment puis-je t’aider ?')}});
const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
const mic=document.getElementById('mic');if(SpeechRecognition){const recognition=new SpeechRecognition();recognition.lang='fr-FR';recognition.interimResults=false;recognition.onresult=e=>{const text=e.results[0][0].transcript;send(text)};recognition.onerror=e=>{status.textContent='Microphone : '+e.error+' · Tu peux toujours écrire.'};recognition.onend=()=>{mic.textContent='🎤'};mic.addEventListener('click',()=>{try{recognition.start();mic.textContent='🔴';status.textContent='Je t’écoute…'}catch{status.textContent='Microphone indisponible pour le moment.'}})}else{mic.addEventListener('click',()=>{status.textContent='Reconnaissance vocale non disponible dans ce navigateur. Utilise le micro du clavier Samsung ou Chrome.'})}
</script></body></html>

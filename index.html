<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10172b"><title>FIL — Compagnon intelligent</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Roboto,Arial,sans-serif}*{box-sizing:border-box}body{margin:0;background:#10172b;color:#f5f7ff}.app{max-width:760px;margin:auto;min-height:100dvh;display:flex;flex-direction:column;padding:clamp(12px,3vw,24px);gap:14px}header{display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:1.5rem}small{color:#aab5d2}.avatar{width:104px;height:104px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#6d5dfc,#28c6bb);font-size:3rem;margin:10px auto 0;box-shadow:0 0 32px #6d5dfc44}.intro{text-align:center;margin:0}.messages{flex:1;min-height:200px;display:flex;flex-direction:column;gap:10px;overflow:auto;padding:8px 0}.bubble{max-width:88%;padding:12px 15px;border-radius:17px;background:#27334d;line-height:1.45;overflow-wrap:anywhere}.mine{align-self:flex-end;background:#5148a9}.status{min-height:20px;color:#b9c5e6;font-size:.9rem}.controls{display:flex;gap:8px;align-items:stretch;padding-bottom:env(safe-area-inset-bottom)}input{flex:1;min-width:0;border:1px solid #52607d;background:#1a2540;color:white;padding:14px;border-radius:14px;font:inherit}button{border:0;border-radius:14px;padding:12px 15px;background:#776bff;color:white;font:inherit;font-weight:600;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #55d5c8}button:disabled{opacity:.5}#talk{background:#266f79}@media(max-width:380px){.controls{flex-wrap:wrap}input{flex-basis:100%}button{flex:1}}
</style>
</head><body><main class="app"><header><h1>FIL</h1><small>Prototype V1</small></header><div class="avatar" aria-label="Avatar de FIL">✦</div><p class="intro">Ton compagnon, à ton rythme.</p><section id="messages" class="messages" role="log" aria-live="polite"><div class="bubble">Bonjour ! Je suis FIL. Tu peux m'écrire ou essayer le bouton Parler. Pour le moment, je suis un prototype sans intelligence artificielle connectée.</div></section><div id="status" class="status" role="status"></div><form id="form" class="controls"><input id="message" aria-label="Ton message" placeholder="Écris à FIL…" autocomplete="off" required><button type="submit">Envoyer</button><button id="talk" type="button">🎤 Parler</button></form></main>
<script>
const form=document.getElementById('form'),input=document.getElementById('message'),messages=document.getElementById('messages'),status=document.getElementById('status'),talk=document.getElementById('talk');
function add(text,mine=false){const div=document.createElement('div');div.className='bubble'+(mine?' mine':'');div.textContent=text;messages.appendChild(div);div.scrollIntoView({block:'end',behavior:'smooth'});}
function reply(text){add(text,true);input.value='';setTimeout(()=>add('Je t’ai entendu ! La conversation intelligente arrivera lorsque nous connecterons FIL à un service d’IA. Pour l’instant, je peux tester les messages et la voix.'),250);}
form.addEventListener('submit',e=>{e.preventDefault();const value=input.value.trim();if(value)reply(value)});
const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SpeechRecognition){talk.addEventListener('click',()=>{status.textContent='La reconnaissance vocale n’est pas disponible dans ce navigateur. Essaie Chrome sur Android ou utilise le clavier.'})}
else{let recognition;talk.addEventListener('click',()=>{try{recognition=new SpeechRecognition();recognition.lang='fr-FR';recognition.interimResults=false;recognition.onstart=()=>{status.textContent='Je t’écoute…';talk.disabled=true};recognition.onresult=e=>{const text=e.results[0][0].transcript;reply(text)};recognition.onerror=e=>{status.textContent='Micro indisponible : '+e.error+'. Vérifie les autorisations du navigateur.'};recognition.onend=()=>{talk.disabled=false;if(status.textContent==='Je t’écoute…')status.textContent='Écoute terminée.'};recognition.start()}catch(e){status.textContent='Impossible de démarrer le micro sur cet appareil.'}})}
</script></body></html>
